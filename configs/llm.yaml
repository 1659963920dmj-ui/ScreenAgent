# ScreenAgent 大模型调用接口示例配置（第 3 周任务 4）
# 说明：api_key 不写入本文件（会入库），走环境变量 LLM_API_KEY 或代码显式传入。

provider: api
model: qwen-vl-max                   # 换成实际使用的模型名
base_url: https://api.openai.com/v1  # OpenAI 兼容端点，可改任何兼容服务地址
# api_key_env: LLM_API_KEY           # 默认值，可省略
timeout: 60.0
max_tokens: 2048
temperature: 0.0
